<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="grafico">
        <canvas id="myChart"></canvas>
      </div>

      <div class="grafico">
        <canvas id="myChart2"></canvas>
      </div>

       <div class="grafico">
        <canvas id="myChart3"></canvas>
      </div>

</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Temperatura',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 3

        }
        ,
        {
        label: 'Umidade',
        data: [80, 82, 88, 85, 80, 83],
        borderWidth: 3
       }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  const ctx2 = document.getElementById('myChart2');

  new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
      datasets: [{
        label: 'Temperatura',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 3

        }
        ,
        {
        label: 'Umidade',
        data: [80, 82, 88, 85, 80, 83],
        borderWidth: 3
       }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

    const ctx3 = document.getElementById('myChart3');

  new Chart(ctx3, {
    type: 'doughnut',
    data: {
      labels: ['Red', 'Blue'],
        datasets: [{
        label: 'MyChart3',
        data: [300, 60],
        backgroundColor: [
          'rgb(255, 99, 132)',
          'rgb(54, 162, 235)'
        ],
    hoverOffset: 4
      }]
    },
  }
);
</script>
